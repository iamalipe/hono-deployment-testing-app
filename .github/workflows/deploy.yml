name: Backend CI/CD (Docker Deployment)

on:
  push:
    branches:
      - main
      - release
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  packages: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Build & Typecheck TypeScript
  # -------------------------------------------------------------
  test-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

  # -------------------------------------------------------------
  # Job 2: Build & Push Docker Image to GHCR (GitHub Packages)
  # -------------------------------------------------------------
  build-and-push-docker:
    name: Build & Push Docker Image
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # Job 3: Deploy to Server via SSH
  # -------------------------------------------------------------
  deploy-to-server:
    name: Deploy to Server via SSH
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    # Only run deployment if SERVER_HOST secret is configured
    if: ${{ secrets.SERVER_HOST != '' }}
    steps:
      - name: Execute remote SSH deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: GITHUB_ACTOR,GITHUB_TOKEN,GITHUB_REPOSITORY
          script: |
            # Pull down the latest container image from GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository }}:latest

            # Stop and remove existing container if present
            docker stop hono-backend || true
            docker rm hono-backend || true

            # Run new container
            docker run -d \
              --name hono-backend \
              --restart unless-stopped \
              -p ${{ secrets.APP_PORT || 3000 }}:3000 \
              ghcr.io/${{ github.repository }}:latest

            # Clean up old unused images
            docker image prune -af --filter "until=24h"

            echo "Deployment successfully completed!"
