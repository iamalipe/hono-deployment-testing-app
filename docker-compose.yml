services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE:-hono-backend:latest}
    container_name: hono-backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
